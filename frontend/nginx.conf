server {
    listen 80;
    server_name localhost;
    client_max_body_size 15m;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Reverse proxy backend API calls to backend container
    location ~ ^/(auth|users|roles|subjects|chapters|questions|exam-matrices|exam-papers|dashboard|student|teacher|admin) {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Revalidate the entry document after deployments. Vite assets are fingerprinted.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # SPA client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
