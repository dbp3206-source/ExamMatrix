services:
  postgres:
    image: postgres:16-alpine
    container_name: exammatrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: exam_matrix
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/V1__init_schema.sql:/docker-entrypoint-initdb.d/V1__init_schema.sql:ro
      - ./database/V2__student_exam_flow.sql:/docker-entrypoint-initdb.d/V2__student_exam_flow.sql:ro
      - ./database/V3__student_exam_access_and_import.sql:/docker-entrypoint-initdb.d/V3__student_exam_access_and_import.sql:ro
      - ./database/V5__google_identity_and_sessions.sql:/docker-entrypoint-initdb.d/V5__google_identity_and_sessions.sql:ro
      - ./database/V6__exam_generation_requests.sql:/docker-entrypoint-initdb.d/V6__exam_generation_requests.sql:ro
      - ./database/V7__generation_advice_snapshots.sql:/docker-entrypoint-initdb.d/V7__generation_advice_snapshots.sql:ro
      - ./database/V8__analytics_scoring_and_class_modes.sql:/docker-entrypoint-initdb.d/V8__analytics_scoring_and_class_modes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d exam_matrix"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - exammatrix-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exammatrix-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/exam_matrix
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_SECURE_COOKIE: "${GOOGLE_SECURE_COOKIE:-false}"
      BOOTSTRAP_ADMIN_ENABLED: "${BOOTSTRAP_ADMIN_ENABLED:-false}"
      BOOTSTRAP_ADMIN_USERNAME: "${BOOTSTRAP_ADMIN_USERNAME:-}"
      BOOTSTRAP_ADMIN_EMAIL: "${BOOTSTRAP_ADMIN_EMAIL:-}"
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:-}"
      DB_DDL_AUTO: "${DB_DDL_AUTO:-update}"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      SERVER_PORT: 8080
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    networks:
      - exammatrix-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_USE_MOCK_API: "false"
    container_name: exammatrix-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exammatrix-net

volumes:
  postgres_data:
    driver: local

networks:
  exammatrix-net:
    driver: bridge
