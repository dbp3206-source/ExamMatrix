spring:
  application:
    name: backend-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

app:
  exams:
    expiry-job-enabled: false
  jwt:
    secret: aW5zZWN1cmUtdGVzdC1qd3Qtc2VjcmV0LWZvci11bml0LXRlc3RzLTEyMzQ1Njc4OTA=
    expiration-minutes: 120

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
