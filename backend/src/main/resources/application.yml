spring.application.name: backend

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exam_matrix}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:c29tZS1zZWN1cmUtand0LXNlY3JldC1leGFtLW1hdHJpeC0yMDI2LWRlZXBtaW5k}
    expiration-minutes: 120