spring.application.name: backend

spring:
  flyway:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exam_matrix}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 32

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: ${MAIL_SMTP_TIMEOUT_MS:10000}
          timeout: ${MAIL_SMTP_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_SMTP_TIMEOUT_MS:10000}

server:
  port: ${SERVER_PORT:8080}

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    secure-cookie: ${GOOGLE_SECURE_COOKIE:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    refresh-window-minutes: ${JWT_REFRESH_WINDOW_MINUTES:30}
  mail:
    from: ${MAIL_FROM:}
    brevo-api-key: ${BREVO_API_KEY:}
    resend-api-key: ${RESEND_API_KEY:}
  otp:
    expiration-minutes: ${OTP_EXPIRATION_MINUTES:5}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    max-resends: ${OTP_MAX_RESENDS:3}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN_SECONDS:60}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  redis:
    enabled: ${REDIS_ENABLED:true}

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
