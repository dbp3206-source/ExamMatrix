spring.application.name: backend

spring:
  flyway:
    enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/exam_matrix}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 32

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

server:
  port: ${SERVER_PORT:8080}

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    secure-cookie: ${GOOGLE_SECURE_COOKIE:false}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: 120
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
